        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}

var municipioSeleccionado = document.getElementById('municipio').value;

var searchControl = new L.Control.Search({
  layer: layer_COLONIA_2,
  propertyName: 'NOMBRE',
  marker: false,
  moveToLocation: function(latlng, title, map) {
    map.setView(latlng, 16);
  },

  // Filtro: municipio + coincidencia de texto
  filterData: function(text, records) {
    var filtered = {};
    var search = text.toLowerCase();

    for (var key in records) {
      var feature = records[key].layer.feature;
      if (
        feature.properties['MUNICIPIO'] == municipioSeleccionado &&
        key.toLowerCase().indexOf(search) !== -1
      ) {
        filtered[key] = records[key];
      }
    }
    return filtered;
  }
}).addTo(map);

// Mover el buscador a tu contenedor
var searchContainer = searchControl.getContainer();
document.getElementById('search-widget').appendChild(searchContainer);

// === Resaltado dinámico + icono en las opciones ===
function escapeRegExp(string) {
  return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightMatches() {
  var input = searchControl._input;
  var query = input.value.trim().toLowerCase();
  var tooltip = searchControl._tooltip;

  if (!tooltip) return;

  var items = tooltip.querySelectorAll('li a');
  items.forEach(function(a) {
    // Guardamos el texto original en data-original si no existe
    if (!a.dataset.original) {
      a.dataset.original = a.textContent;
    }
    var originalText = a.dataset.original;

    if (!query) {
      a.innerHTML = '📍 ' + originalText;
    } else {
      var safe = escapeRegExp(query);
      var regex = new RegExp('(' + safe + ')', 'gi');
      a.innerHTML = '📍 ' + originalText.replace(regex, '<strong class="match">$1</strong>');
    }
  });
}

// Cada vez que escribes
searchControl._input.addEventListener('input', function() {
  setTimeout(highlightMatches, 50);
});

// Cada vez que se abre el tooltip
map.on('search:expanded', function() {
  setTimeout(highlightMatches, 50);
});

// También al refrescar resultados
map.on('search:collapsed', function() {
  setTimeout(highlightMatches, 50);
});

// Evento para actualizar el filtro al cambiar municipio
document.getElementById('municipio').addEventListener('change', function(e) {
  municipioSeleccionado = e.target.value;
  searchControl._input.value = ""; // limpia el input

// =======================
// Indicador visual de modo edición
// =======================
function mostrarIndicadorModo(activo) {
  let indicador = document.getElementById("edit-indicator");
  if (!indicador) {
    indicador = document.createElement("div");
    indicador.id = "edit-indicator";
    indicador.style.position = "fixed";
    indicador.style.bottom = "20px";
    indicador.style.right = "10px";
    indicador.style.padding = "6px 12px";
    indicador.style.borderRadius = "4px";
    indicador.style.fontWeight = "bold";
    indicador.style.color = "white";
    indicador.style.zIndex = "9999";
    document.body.appendChild(indicador);
  }

  if (activo) {
    indicador.style.background = "red";
    indicador.textContent = "🛠 Modo edición ACTIVADO";
    indicador.style.display = "block";
  } else {
    indicador.style.background = "green";
    indicador.textContent = "Modo edición DESACTIVADO";
    indicador.style.display = "block";
    setTimeout(() => indicador.style.display = "none", 2000);
  }
}

// =======================
// Toggle del Modo Edición
// =======================
function toggleEditMode(active) {
  editMode = active;
  editBtn.classList.toggle("active", editMode);

  if (editMode) {
    // Guardar y quitar popups de capas QGIS
    map.eachLayer(layer => {
      if (layer.getPopup && layer.getPopup()) {
        storedPopups.set(layer, layer.getPopup().getContent());
        layer.unbindPopup();
      }
    });
  } else {
    // Restaurar popups originales
    storedPopups.forEach((content, layer) => {
      layer.bindPopup(content);
    });
    storedPopups.clear();
  }

  mostrarIndicadorModo(editMode);
}

editBtn.addEventListener("click", () => {

function abrirFormularioPin(lat, lng) {
  const hoy = new Date();
  const fechaActual = hoy.toISOString().split("T")[0];
  const horaActual = hoy.toTimeString().slice(0, 5);

  const popupContent = `
    <form id="pin-form">
      <label for="pin-title">Título<br>
        <input type="text" id="pin-title" required>
      </label><br>
      <label for="pin-desc">Descripción:<br>
        <textarea id="pin-desc"></textarea>
      </label><br>
      <label for="pin-tipo">Tipo de marcador:<br>
        <select id="pin-tipo" required>
          <option value="">-- Selecciona --</option>
          <option value="2023">Presupuesto Participativo 2023</option>
          <option value="2024">Presupuesto Participativo 2024</option>
          <option value="2025">Presupuesto Participativo 2025</option>
          <option value="2026">Presupuesto Participativo 2026</option>
        </select>
      </label><br>
      <label for="pin-fecha">Fecha:<br>
        <input type="date" id="pin-fecha" value="${fechaActual}" required>
      </label><br>
      <label for="pin-hora">Hora:<br>
        <input type="time" id="pin-hora" value="${horaActual}" required>
      </label><br>
      <button type="submit">💾 Guardar</button>
    </form>
  `;

  L.popup().setLatLng([lat, lng]).setContent(popupContent).openOn(map);

  setTimeout(() => {
    const form = document.getElementById("pin-form");
    if (!form) return;

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const titulo = document.getElementById("pin-title").value.trim();
      const descripcion = document.getElementById("pin-desc").value.trim();
      const tipo = document.getElementById("pin-tipo").value;
      const fecha = document.getElementById("pin-fecha").value;
      const hora = document.getElementById("pin-hora").value;

      if (!tipo) {
        alert("Debes seleccionar un tipo de marcador");
        return;
      }

      try {
        const ref = collection(db, `markers${tipo}`);
        const docRef = await addDoc(ref, { lat, lng, titulo, descripcion, fecha, hora, tipo });

        const marker = L.marker([lat, lng], { icon: iconosPresupuesto[tipo] })
          .bindPopup(`
            <div class="custom-popup">
              <h3>${titulo}</h3>
              <p>${descripcion}</p>
              <p><strong>Tipo:</strong> Presupuesto ${tipo}</p>
              <small>${fecha} ${hora}</small>
              <button class="delete-pin" data-id="${docRef.id}" data-tipo="${tipo}">🗑 Eliminar</button>
            </div>
          `);

        // Agregar al grupo del año (no directo al mapa)
        capasPresupuesto[tipo].addLayer(marker);

        // Eliminar desde Firestore y del grupo
        marker.on("popupopen", () => {
          const btn = document.querySelector(".delete-pin");
          if (btn) {
            btn.addEventListener("click", async (e) => {
              const id = e.target.getAttribute("data-id");
              const t = e.target.getAttribute("data-tipo");
              await deleteDoc(doc(db, `markers${t}`, id));
              capasPresupuesto[t].removeLayer(marker);
            });
          }
        });

        map.closePopup();
      } catch (error) {
        console.error("Error guardando pin:", error);
      }
    });
  }, 0);
}




// =======================
// Cargar pines desde Firestore (2023, 2024, 2025)
// =======================
async function cargarMarkers() {
  for (let tipo of [2023, 2024, 2025, 2026]) {
    const ref = collection(db, `markers${tipo}`);
    const querySnapshot = await getDocs(ref);

    querySnapshot.forEach(docSnap => {
      const data = docSnap.data();

      const marker = L.marker([data.lat, data.lng], { icon: iconosPresupuesto[String(tipo)] })
        .bindPopup(`
          <div class="custom-popup">
            <h3>${data.titulo}</h3>
            <p>${data.descripcion}</p>
            <p><strong>Tipo:</strong> Presupuesto ${tipo}</p>
            <small>${data.fecha} ${data.hora}</small>
            <button class="delete-pin" data-id="${docSnap.id}" data-tipo="${tipo}">🗑 Eliminar</button>
          </div>
        `);

      // Agregar al grupo del año
      capasPresupuesto[tipo].addLayer(marker);

      marker.on("popupopen", () => {
        const btn = document.querySelector(".delete-pin");
        if (btn) {
          btn.addEventListener("click", async (e) => {
            const id = e.target.getAttribute("data-id");
            const t = e.target.getAttribute("data-tipo");
            await deleteDoc(doc(db, `markers${t}`, id));
            capasPresupuesto[t].removeLayer(marker);
          });
        }
      });
    });
  }
}
