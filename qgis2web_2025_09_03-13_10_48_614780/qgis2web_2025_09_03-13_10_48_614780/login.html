<!DOCTYPE html>
<html lang = "es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión</title>
        <!-- Fuente para Formulario -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
        <!--Iconos-->
        <link rel="stylesheet" href="https://cdnjs.cloudfare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="css/login.css">
        </head>
            <body>
                <div class="login-container">
                    <img src="images/logo.png" alt="Logo" class="logo">
                    <h2>Bienvenido</h2>
                    <p class="subtitle">Accede para ver el mapa</p>
                    <form id="loginForm">
                        <div class="input-group fade-in">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="input-group fade-in" style="animation-delay: 0.2s;">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Contraseña" required>
                        </div>
                        <button type="submit" class="fade-in" style="animation-delay: 0.4s;">Entrar</button>
                    </form>
                </div>
            </body>
            <script> function mostrarError(){
                const container = document.querySelector('.login-container');
                if(container){
                    container.classList.add('shake');
                    setTimeout(()=> container.classList.remove('shake'), 500);
                }
            }
            </script>
           

            <script type="module">

            import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
            import {getAuth, signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
                   const firebaseConfig = {
                     apiKey: "AIzaSyBtNEGmQXFBkPQ2uJMvMw0Fem_vCXvIPMQ",
    authDomain: "mapa-estado.firebaseapp.com",
    projectId: "mapa-estado",
    storageBucket: "mapa-estado.firebasestorage.app",
    messagingSenderId: "538361795759",
    appId: "1:538361795759:web:c73f2d186a2a0eb0d6b05a",
    measurementId: "G-1V9STQDMFF"
                    }; 

                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);

                  document.getElementById("loginForm").addEventListener("submit",(e)=> {
                 e.preventDefault();
                 const email = document.getElementById("email").value;
                 const password = document.getElementById("password").value;

                signInWithEmailAndPassword(auth, email, password)
                   .then(() => {
                 window.location.href = "index.html"; // Ir al mapa
                  })
                  .catch((error) => {
                   console.error("Error al iniciar sesion: ", error);
                   mostrarError();
                  });
                 });
                    </script>
</html>
